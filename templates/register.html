{% extends "base.html" %}{% block title %}Create account · ARINEX{% endblock %}
{% block content %}<section class="panel narrow"><p class="eyebrow">START YOUR PREPARATION</p>
    <h1>Create account</h1><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Username<input name="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" autocomplete="username"><small>3–30 letters, numbers or underscores.</small></label><label>WhatsApp number<input name="whatsapp" required pattern="\+?[0-9]{10,15}" placeholder="e.g. 08012345678" autocomplete="tel"></label><label>Password<input type="password" name="password" required minlength="10" autocomplete="new-password"><small>Use at least 10 characters.</small></label><label>Confirm password<input type="password" name="confirm_password" required minlength="10" autocomplete="new-password"></label><label class="check-row"><input type="checkbox" name="agree_rules" required><span>I have read and agree to the <a href="{{ url_for('rules') }}">rules</a>.</span></label><button class="button" type="submit">Create account</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section>>{% endblock %}
