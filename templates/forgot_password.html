
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | ARINEX JAMB PREP</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
        }

        .recovery-card {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #123b70;
            font-size: 25px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
            color: #26364a;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd4df;
            border-radius: 7px;
            font-size: 16px;
        }

        button, .back-link {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 18px;
            border: none;
            border-radius: 7px;
            text-align: center;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #16834a;
            color: white;
        }

        .back-link {
            color: #123b70;
            background: #edf2f8;
        }

        .notice {
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
    <main class="recovery-card">
        <h1>Forgot Password?</h1>

        <p>
            Enter your ARINEX username and registered WhatsApp number.
            A recovery request will be sent to the ARINEX administrator.
        </p>

        <form id="recoveryForm">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                required
                autocomplete="username"
                placeholder="Enter your username"
            >

            <label for="phone">Registered WhatsApp Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                required
                autocomplete="tel"
                placeholder="Enter your registered number"
            >

            <button type="submit">Request Password Help on WhatsApp</button>
        </form>

        <p class="notice">
            Your request does not reset your password automatically.
            The administrator must verify your account first.
        </p>

        <a class="back-link" href="/login">Back to Login</a>
    </main>

    <script>
        document.getElementById("recoveryForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const phone = document.getElementById("phone").value.trim();

            if (!username || !phone) {
                alert("Please enter both fields.");
                return;
            }

            const message =
                "ARINEX JAMB PREP password recovery request\n\n" +
                "Username: " + username + "\n" +
                "Registered WhatsApp number: " + phone + "\n\n" +
                "Please help me recover access to my account.";

            const whatsappURL =
                "https://wa.me/2347025644796?text=" +
                encodeURIComponent(message);

            window.location.href = whatsappURL;
        });
    </script>
</body>
</html>
