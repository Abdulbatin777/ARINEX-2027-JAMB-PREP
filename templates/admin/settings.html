{% extends "base.html" %}{% block title %}Settings · ARINEX{% endblock %}
{% block content %}<section class="page-heading"><p class="eyebrow">ADMIN / SETTINGS</p><h1>Application settings</h1></section><section class="panel narrow"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Premium price (₦)<input type="number" name="premium_price" min="1" required value="{{ settings['premium_price'] }}"></label><label>Default Practice question count<input type="number" name="practice_default_count" min="1" max="180" required value="{{ settings['practice_default_count'] }}"></label><label>Default Practice duration (minutes)<input type="number" name="practice_default_minutes" min="1" max="180" required value="{{ settings['practice_default_minutes'] }}"></label><button class="button" type="submit">Save settings</button></form><p class="muted small">The configured payment receiving details remain in config.py/environment variables.</p></section>{% endblock %}
