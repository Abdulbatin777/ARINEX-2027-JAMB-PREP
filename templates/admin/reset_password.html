
{% extends "base.html" %}

{% block title %}Reset Student Password · ARINEX{% endblock %}

{% block content %}
<section class="page-heading">
    <p class="eyebrow">ADMIN / STUDENTS</p>
    <h1>Reset Student Password</h1>
    <p>
        Set a new password for student:
        <strong>{{ student['username'] }}</strong>
    </p>
</section>

<div class="form-card">
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="password">New Password</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
            autocomplete="new-password"
            placeholder="At least 8 characters"
        >

        <label for="confirm_password">Confirm New Password</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            minlength="8"
            required
            autocomplete="new-password"
            placeholder="Enter the new password again"
        >

        <button type="submit">Reset Student Password</button>
        <a href="{{ url_for('admin_students') }}">Cancel</a>
    </form>
</div>
{% endblock %}
